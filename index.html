<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmiatría Laya | En Mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .mensaje {
            color: #7c4d6f;
            font-size: 22px;
            padding: 40px;
            line-height: 1.6;
        }
        .mensaje h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #a86f9b;
        }
    </style>
</head>
<body>
    <div class="mensaje">
        <h1>🔧 Página en mantenimiento</h1>
        <p>La página está siendo actualizada.<br>Por favor, vuelve más tarde.</p>
    </div>
</body>
</html>
